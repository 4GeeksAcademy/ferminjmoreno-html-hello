<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Escenario con luces</title>
  <desc id="desc">Ilustracion abstracta de un escenario musical con luces y publico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#1d1d1d"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#f5c242" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f5c242" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="220" rx="420" ry="210" fill="url(#spot)"/>
  <rect x="120" y="500" width="960" height="180" rx="20" fill="#101010" stroke="#2b2b2b"/>
  <circle cx="280" cy="560" r="14" fill="#ffffff"/>
  <circle cx="360" cy="560" r="10" fill="#ffffff"/>
  <circle cx="440" cy="560" r="12" fill="#ffffff"/>
  <circle cx="520" cy="560" r="9" fill="#ffffff"/>
  <circle cx="680" cy="560" r="11" fill="#ffffff"/>
  <circle cx="760" cy="560" r="10" fill="#ffffff"/>
  <circle cx="840" cy="560" r="13" fill="#ffffff"/>
  <circle cx="920" cy="560" r="9" fill="#ffffff"/>
</svg>
